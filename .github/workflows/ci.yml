name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------- 后端单元测试 ----------
  backend-unit-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml

      - name: Run unit tests
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw --batch-mode test

  # ---------- 后端集成测试与打包 ----------
  backend-integration-test:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: backend-unit-test

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: xianqi_test_root
          MYSQL_DATABASE: xianqi_test
          MYSQL_USER: xianqi
          MYSQL_PASSWORD: xianqi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u xianqi -pxianqi_test --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MYSQL_URL: jdbc:mysql://127.0.0.1:3306/xianqi_test?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectionCollation=utf8mb4_unicode_ci
      MYSQL_USER: xianqi
      MYSQL_PASSWORD: xianqi_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml

      - name: Verify integration tests and package
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw --batch-mode verify

      - name: Upload jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # ---------- 管理后台构建 ----------
  admin-build:
    name: Admin Frontend Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: |
          cd admin
          npm ci

      - name: Lint
        run: |
          cd admin
          npm run lint

      - name: Build
        run: |
          cd admin
          npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: admin-dist
          path: admin/dist
          retention-days: 7

  # ---------- H5 用户端构建 ----------
  mobile-build:
    name: Mobile H5 Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: |
          cd mobile
          npm ci

      - name: Lint
        run: |
          cd mobile
          npm run lint

      - name: Build H5
        run: |
          cd mobile
          npm run build:h5

      - name: Upload H5 dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: mobile-h5-dist
          path: mobile/dist/build/h5
          retention-days: 7
