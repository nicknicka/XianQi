# ==========================================
# XianQi 平台 Docker Compose 配置
# ==========================================

services:
  # ---------- Nginx 网关 ----------
  nginx:
    image: nginx:alpine
    container_name: xianqi-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - xianqi_uploads:/usr/share/nginx/uploads:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
      - admin
      - mobile-h5

  # ---------- Spring Boot 后端 ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xianqi-backend
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "8081:8080"  # 开发时直连用，生产可注释
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SERVER_PORT=${SERVER_PORT:-8080}
      - MYSQL_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-Xianqi}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - MYSQL_USER=${MYSQL_USER:-xianqi}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-xianqi123}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - JWT_EXPIRE_HOURS=${JWT_EXPIRE_HOURS:-24}
      - JWT_REFRESH_EXPIRE_DAYS=${JWT_REFRESH_EXPIRE_DAYS:-7}
      - UPLOAD_PATH=${UPLOAD_PATH:-/app/uploads}
      - OSS_ENABLED=${OSS_ENABLED:-false}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - OSS_BUCKET_NAME=${OSS_BUCKET_NAME:-}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - ZHIPUAI_ENABLED=${ZHIPUAI_ENABLED:-true}
      - ZHIPUAI_API_KEY=${ZHIPUAI_API_KEY:-}
      - ZHIPUAI_MODEL=${ZHIPUAI_MODEL:-glm-4-flash}
      - SMS_ENABLED=${SMS_ENABLED:-false}
      - SMS_ACCESS_KEY_ID=${SMS_ACCESS_KEY_ID:-}
      - SMS_ACCESS_KEY_SECRET=${SMS_ACCESS_KEY_SECRET:-}
      - ALIPAY_MOCK=${ALIPAY_MOCK:-true}
      - AMAP_ENABLED=${AMAP_ENABLED:-false}
    volumes:
      - xianqi_uploads:/app/uploads
      - ./logs/backend:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------- MySQL 数据库 ----------
  mysql:
    image: mysql:8.0
    container_name: xianqi-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-xianqi_root_123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-Xianqi}
      - MYSQL_USER=${MYSQL_USER:-xianqi}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-xianqi123}
      - TZ=Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - xianqi_mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
      - ./logs/mysql:/var/log/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
      - --max-connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER:-xianqi}", "-p${MYSQL_PASSWORD:-xianqi123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- Redis 缓存 ----------
  redis:
    image: redis:7-alpine
    container_name: xianqi-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - xianqi_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------- Admin 管理后台（静态） ----------
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: xianqi-admin
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./logs/admin:/var/log/nginx

  # ---------- Mobile H5 用户端（静态） ----------
  mobile-h5:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: xianqi-mobile-h5
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./logs/mobile:/var/log/nginx

  # ---------- phpMyAdmin（开发工具） ----------
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: xianqi-phpmyadmin
    restart: unless-stopped
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_USER=${MYSQL_USER:-xianqi}
      - PMA_PASSWORD=${MYSQL_PASSWORD:-xianqi123}
      - UPLOAD_LIMIT=100M
    ports:
      - "${PHPMYADMIN_PORT:-8089}:80"
    depends_on:
      - mysql
    profiles:
      - dev

  # ---------- Redis Commander（开发工具） ----------
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: xianqi-redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:-}
      - HTTP_USER=admin
      - HTTP_PASSWORD=admin123
    ports:
      - "${REDIS_COMMANDER_PORT:-8090}:8081"
    depends_on:
      - redis
    profiles:
      - dev

# ---------- 数据卷 ----------
volumes:
  xianqi_mysql_data:
    name: xianqi_mysql_data
  xianqi_redis_data:
    name: xianqi_redis_data
  xianqi_uploads:
    name: xianqi_uploads
