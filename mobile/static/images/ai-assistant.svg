<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9500;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="100" fill="url(#gradient)"/>

  <!-- 机器人脸 -->
  <circle cx="100" cy="90" r="50" fill="#ffffff" opacity="0.95"/>

  <!-- 眼睛 -->
  <ellipse cx="80" cy="85" rx="12" ry="14" fill="#333"/>
  <ellipse cx="120" cy="85" rx="12" ry="14" fill="#333"/>
  <circle cx="84" cy="81" r="5" fill="#fff"/>
  <circle cx="124" cy="81" r="5" fill="#fff"/>

  <!-- 天线 -->
  <line x1="100" y1="40" x2="100" y2="20" stroke="#fff" stroke-width="4"/>
  <circle cx="100" cy="15" r="8" fill="#fff"/>

  <!-- 微笑 -->
  <path d="M 70 110 Q 100 135 130 110" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- 耳朵 -->
  <rect x="30" y="80" width="15" height="30" rx="5" fill="#ffffff" opacity="0.9"/>
  <rect x="155" y="80" width="15" height="30" rx="5" fill="#ffffff" opacity="0.9"/>
</svg>
